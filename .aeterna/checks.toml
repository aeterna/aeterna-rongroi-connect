[[checks]]
name = "test"
cmd = "node --test"
timeout = 60
deps = [
  "package.json",
  "sidecar.lock.json",
  "src/**",
  "test/**",
  "scripts/**",
  "native/**",
]
prove = ".aeterna/prove/test.patch"

[[checks]]
name = "lint"
cmd = 'npm ci --offline --ignore-scripts --no-audit --no-fund --cache "/Users/$USER/.npm" && npm run lint'
timeout = 120
deps = [
  "eslint.config.js",
  "package.json",
  "package-lock.json",
  "src/**",
  "test/**",
  "native/**",
]
prove = ".aeterna/prove/lint.patch"
