name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: node (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install without running package scripts
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Licensing (REUSE)
        run: pipx run --spec reuse==6.3.0 reuse lint

  pipe:
    name: pipe module (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.1
      - name: Format
        working-directory: native/pipe
        run: cargo fmt --check
      - name: Clippy
        working-directory: native/pipe
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Banned crates
        working-directory: native/pipe
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny --config deny.toml check bans
      - name: Tests on a real pipe
        working-directory: native/pipe
        run: cargo test --locked

  quarantine:
    # ADR 0001 section 2: the proof runs on what ships. A hosted runner, never a shared one.
    name: quarantine proof (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Rust toolchain
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Install without running package scripts
        run: npm ci --ignore-scripts
      - name: Build the pipe module
        run: npm run build:native
      # Lane 3c: until Connect 0.1.0 the sidecar is built from source at the commit in
      # sidecar.lock.json (an unofficial build, decided 2026-11-06). 0.1.0 fetches a release asset.
      - name: Read the pinned sidecar commit
        id: lock
        run: |
          $ErrorActionPreference = "Stop"
          $lock = Get-Content sidecar.lock.json -Raw | ConvertFrom-Json
          if ($lock.source -ne "build" -or $lock.repository -ne "aeterna/aeterna-rongroi" -or $lock.commit -notmatch '^[0-9a-f]{40}$') {
            throw "sidecar.lock.json must pin a 40-hex commit of aeterna/aeterna-rongroi"
          }
          "commit=$($lock.commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeterna/aeterna-rongroi
          ref: ${{ steps.lock.outputs.commit }}
          path: _rongroi
          persist-credentials: false
      - name: Build the sidecar at the pinned commit
        working-directory: _rongroi
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --release --locked -p rongroi-scan
          New-Item -ItemType Directory -Force -Path ../vendor | Out-Null
          Copy-Item target/release/rongroi-scan.exe ../vendor/rongroi-scan.exe
          (Get-FileHash ../vendor/rongroi-scan.exe -Algorithm SHA256).Hash
      - name: Build the release folder
        run: npm run build
      - name: Build the test folder
        run: npm run build:test
      - name: Compare the two builds
        run: node scripts/compare-builds.js dist/release dist/test
      - name: Run the whole flow and check the netlog
        run: npm run e2e
      - name: The netlog check can fail
        run: node scripts/run-e2e.js dist/test --negative-control
      - name: The release folder stays running for 8 seconds
        run: node scripts/run-e2e.js --release-smoke dist/release
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            e2e-report.json
            e2e-netlog.json
            e2e-negative-report.json
            e2e-negative-netlog.json
          if-no-files-found: warn
